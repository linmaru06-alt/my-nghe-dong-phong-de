name: Daily Smart Auto Publisher (Ramp-up)

on:
  schedule:
    # 00:30 UTC = 07:30 Giờ Việt Nam (Slot 1: Tin tức & Thị trường)
    - cron: '30 0 * * *'
    # 13:30 UTC = 20:30 Giờ Việt Nam (Slot 2: Cẩm nang Content Pillar chuyên sâu)
    - cron: '30 13 * * *'
    # --- GIAI ĐOẠN 2: MỞ TOÀN LỰC KHI ĐÃ THOÁT SANDBOX (Sau 30 ngày) ---
    # - cron: '30 4 * * *'  # 11:30 VN: Kiến thức về gỗ
    # - cron: '30 9 * * *'  # 16:30 VN: Bảo quản sản phẩm
  # Cho phép kích hoạt thủ công từ giao diện GitHub bất cứ lúc nào
  workflow_dispatch:
    inputs:
      slot:
        description: 'Chọn khung giờ (1: Tin tức, 2: Kiến thức, 3: Bảo quản, 4: Lựa chọn, hoặc để trống tự nhận diện)'
        required: false
        default: ''

jobs:
  publish-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Auto Publisher Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            npx tsx scripts/ai-schedule-publisher.mjs --slot=${{ github.event.inputs.slot }}
          else
            npx tsx scripts/ai-schedule-publisher.mjs
          fi

      - name: Commit & Push New Post If Updated
        run: |
          set -e
          git config user.name "Dong Phong Auto Bot"
          git config user.email "bot@mynghedongphong.vn"
          git add data/posts.json
          echo "--- git status ---"
          git status --short
          if git diff --staged --quiet; then
            echo "Khong co thay doi nao trong data/posts.json — bo qua commit."
            exit 0
          fi
          git commit -m "chore(auto-news): tu dong xuat ban bai viet moi [skip ci]"
          echo "--- pull --rebase ---"
          git pull --rebase --autostash origin main
          echo "--- push ---"
          git push origin main

